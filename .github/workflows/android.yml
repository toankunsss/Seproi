# Builds the Android app on every push / PR that touches the game or the mobile project.
# Download the APK from the run's "Artifacts" section (Actions tab → the run → sep-roi-debug-apk).
#
# Optional signed release (.aab for Google Play): add these repository secrets
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks file   (base64 -w0 my-release.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android build

on:
  push:
    paths: ['index.html', 'css/**', 'js/**', 'fonts/**', 'mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'css/**', 'js/**', 'fonts/**', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy web game into the Android project
        run: npm run web && npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sep-roi-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Build signed release bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=../release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: sep-roi-release
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
