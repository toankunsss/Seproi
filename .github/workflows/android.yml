# Builds the Android app on every push / PR that touches the game or the mobile project.
# Download the APK:
#   - easiest: the "apk-latest" release (repo → Releases → "Whip Boss – bản APK mới nhất"),
#     updated on every push; the .apk installs straight from a phone browser
#   - or the run's "Artifacts" section (Actions tab → the run → whipboss-debug-apk, a .zip)
#
# Google Play bundle: every run also builds the release .aab and attaches it to the same
# release (WhipBoss-release-unsigned.aab → sign it with your upload key, see docs/MOBILE.md).
# To get it signed here instead, add these repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks file   (base64 -w0 whipboss-upload.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android build

on:
  push:
    paths: ['index.html', 'css/**', 'js/**', 'fonts/**', 'mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'css/**', 'js/**', 'fonts/**', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the APK to the "apk-latest" release
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy web game into the Android project
        run: npm run web && npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: whipboss-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      # Replace the "apk-latest" pre-release with this build so the newest APK is always one tap away.
      - name: Publish APK to the apk-latest release
        if: github.event_name != 'pull_request'
        working-directory: mobile/android/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-debug.apk WhipBoss-debug.apk
          gh release delete apk-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create apk-latest WhipBoss-debug.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Whip Boss – bản APK mới nhất" \
            --notes "Bản debug build tự động từ nhánh ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Tải WhipBoss-debug.apk về điện thoại Android rồi mở để cài (cho phép cài ứng dụng từ nguồn không xác định)."

      # Google Play bundle (.aab). Signed when the keystore secrets below exist; otherwise built
      # unsigned and signed afterwards on your own machine with jarsigner (docs/MOBILE.md), so the
      # upload key never has to leave your computer.
      - name: Build release bundle
        working-directory: mobile/android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
            printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASSWORD" "$KS_ALIAS" "$KS_KEY_PASSWORD" > keystore.properties
          fi
          ./gradlew bundleRelease --no-daemon
          cd app/build/outputs/bundle/release
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then mv app-release.aab WhipBoss-release.aab; else mv app-release.aab WhipBoss-release-unsigned.aab; fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: whipboss-release-bundle
          path: mobile/android/app/build/outputs/bundle/release/*.aab

      - name: Attach the bundle to the apk-latest release
        if: github.event_name != 'pull_request'
        working-directory: mobile/android/app/build/outputs/bundle/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload apk-latest *.aab --repo "$GITHUB_REPOSITORY" --clobber
