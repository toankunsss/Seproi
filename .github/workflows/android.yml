# Builds the Android app on every push / PR that touches the game or the mobile project.
# Download the APK:
#   - easiest: the "apk-latest" release (repo → Releases → "Whip Boss – bản APK mới nhất"),
#     updated on every push; the .apk installs straight from a phone browser
#   - or the run's "Artifacts" section (Actions tab → the run → sep-roi-debug-apk, a .zip)
#
# Optional signed release (.aab for Google Play): add these repository secrets
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks file   (base64 -w0 my-release.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android build

on:
  push:
    paths: ['index.html', 'css/**', 'js/**', 'fonts/**', 'mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'css/**', 'js/**', 'fonts/**', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the APK to the "apk-latest" release
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy web game into the Android project
        run: npm run web && npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sep-roi-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      # Replace the "apk-latest" pre-release with this build so the newest APK is always one tap away.
      - name: Publish APK to the apk-latest release
        if: github.event_name != 'pull_request'
        working-directory: mobile/android/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-debug.apk WhipBoss-debug.apk
          gh release delete apk-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create apk-latest WhipBoss-debug.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Whip Boss – bản APK mới nhất" \
            --notes "Bản debug build tự động từ nhánh ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Tải WhipBoss-debug.apk về điện thoại Android rồi mở để cài (cho phép cài ứng dụng từ nguồn không xác định)."

      - name: Build signed release bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=../release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: sep-roi-release
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
